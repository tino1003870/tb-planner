<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TB Planner – Thunderbird</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="planner-header">

    <div class="title-row">
        <h1>TB Planner</h1>
    </div>

    <div class="connection-row">
        <label for="calendarSelect">Kalender:</label>
        <select id="calendarSelect"></select>
        <button id="refreshButton" type="button">Aktualisieren</button>
    </div>


    <div class="planner-toolbar">

        <div class="toolbar-section task-section">

            <div class="toolbar-section-title">Task</div>

            <div class="toolbar-group">

                <button id="newTaskButton" type="button">
                    Task erstellen
                </button>

                <button id="renameTaskButton" type="button" disabled>
                    Titel ändern
                </button>

                <button id="deleteTaskButton" type="button" disabled>
                    Task löschen
                </button>

            </div>

        </div>


        <div class="toolbar-section">

            <div class="toolbar-section-title">Struktur</div>

            <div class="toolbar-group">

                <button id="indentButton" type="button" disabled>
                    → Einrücken
                </button>

                <button id="outdentButton" type="button" disabled>
                    ← Ausrücken
                </button>

                <button id="moveUpButton" type="button" disabled>
                    ↑
                </button>

                <button id="moveDownButton" type="button" disabled>
                    ↓
                </button>

            </div>

        </div>


        <div class="toolbar-section">

            <div class="toolbar-section-title">Termin</div>

            <div class="toolbar-group">

                <button id="previousWeekButton" type="button">
                    − Woche
                </button>

                <button id="previousDayButton" type="button">
                    − Tag
                </button>

                <button id="nextDayButton" type="button">
                    + Tag
                </button>

                <button id="nextWeekButton" type="button">
                    + Woche
                </button>

            </div>

        </div>


        <div class="toolbar-section">

            <div class="toolbar-section-title">Dauer</div>

            <div class="toolbar-group">

                <button id="durationMinusButton" type="button">
                    − Dauer
                </button>

                <button id="durationPlusButton" type="button">
                    + Dauer
                </button>

            </div>

        </div>


        <div class="toolbar-section zoom-section">

            <div class="toolbar-section-title">Ansicht</div>

            <div class="toolbar-group zoom-group">

                <button id="zoomDayButton" type="button">
                    Tag
                </button>

                <button id="zoomWeekButton" type="button">
                    Woche
                </button>

                <button id="zoomMonthButton" type="button">
                    Monat
                </button>

                <button id="zoomYearButton" type="button">
                    KW
                </button>

            </div>


        <div class="toolbar-section file-section">

            <div class="toolbar-section-title">Datei</div>

            <div class="toolbar-group">

                <button
                    id="importButton"
                    type="button">
                    Import
                </button>

                <button
                    id="exportButton"
                    type="button">
                    Export
                </button>

            </div>

        </div>
        </div>

    </div>

</header>


<main class="planner-main">

    <section class="planner">

        <div class="planner-table-header">

            <div class="wbs-header">
                WBS
            </div>

            <div class="task-header">
                Aufgabe
            </div>

            <div
                id="timelineHeader"
                class="timeline-header"
            >
                <!-- timeline generated by JavaScript -->
            </div>

        </div>


        <div
            id="plannerRows"
            class="planner-rows"
        >
            <!-- planner rows generated by JavaScript -->
        </div>

    </section>

<section
    id="todoEditor"
    class="todo-editor hidden"
>

    <div class="todo-editor-header">

        <strong>VTODO bearbeiten</strong>

        <span id="todoEditorTask"></span>

    </div>


    <div class="todo-editor-body">

        <div class="editor-field">

            <label for="todoTitleInput">
                Titel:
            </label>

            <input
                id="todoTitleInput"
                type="text"
                autocomplete="off"
            >

        </div>


        <div class="editor-field">

            <label for="todoDescriptionInput">
                Beschreibung:
            </label>

            <textarea
                id="todoDescriptionInput"
                rows="5"
                placeholder="Beschreibung des Tasks ..."
            ></textarea>

        </div>


        <div class="editor-field">

            <label for="todoProgressInput">
                Erfüllungsgrad:
            </label>

            <div class="progress-editor">

                <input
                    id="todoProgressInput"
                    type="range"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                >

                <output id="todoProgressValue">
                    0 %
                </output>

            </div>

        </div>


        <div class="editor-info-grid">

            <div>

                <label for="todoStartInput">
                    Start:
                </label>

                <input
                    id="todoStartInput"
                    type="date"
                    disabled
                >

            </div>


            <div>

                <label>
                    Fällig:
                </label>

                <span id="todoDueValue">
                    -
                </span>

            </div>


            <div>

                <label for="todoDurationInput">
                    Dauer:
                </label>

                <input
                    id="todoDurationInput"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                    disabled
                >

                <span>Tag(e)</span>

            </div>

        </div>


        <div class="todo-editor-actions">

            <button
                id="todoSaveButton"
                type="button"
            >
                Speichern
            </button>


            <button
                id="todoCancelButton"
                type="button"
            >
                Abbrechen
            </button>


            <button
                id="todoDeleteButton"
                type="button"
                class="danger-button"
            >
                Task löschen
            </button>

        </div>

    </div>

</section>



</main>


<footer class="planner-footer">

    <span id="status">
        Bereit
    </span>

</footer>


<!--
    Debug output is deliberately kept in the DOM.
    It can be hidden later without removing the functionality.
-->

<section class="debug-panel">

    <details>

        <summary>CalDAV Debug</summary>

        <pre id="headers"></pre>

        <pre id="response"></pre>

        <pre id="debug"></pre>

    </details>

</section>


<script type="module" src="src/planner.js"></script>

</body>
</html>
